name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        run: msbuild "Choose students.sln" /p:Configuration=Release /p:Platform="Any CPU" /v:minimal /nologo

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "bin/Release/Choose students.exe" --title "Bad Luck Picker ${{ github.ref_name }}" --generate-notes
